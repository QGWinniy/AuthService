services:

  # =========================
  # Users PostgreSQL
  # =========================

  users-db:
    image: postgres:16-alpine
    container_name: users-db

    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}

    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./migrations/users:/docker-entrypoint-initdb.d:ro

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Sessions PostgreSQL
  # =========================
  #
  # Пока не используется.
  #
  # sessions-db:
  #   image: postgres:16-alpine
  #   container_name: sessions-db
  #
  #   environment:
  #     POSTGRES_USER: ${SESSIONS_DB_USER}
  #     POSTGRES_PASSWORD: ${SESSIONS_DB_PASSWORD}
  #     POSTGRES_DB: ${SESSIONS_DB_NAME}
  #
  #   volumes:
  #     - sessions-db-data:/var/lib/postgresql/data
  #     - ./migrations/sessions:/docker-entrypoint-initdb.d:ro
  #
  #   networks:
  #     - backend
  #
  #   restart: unless-stopped


  # =========================
  # Redis
  # =========================

  redis:
    image: redis:7-alpine
    container_name: redis

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis-data:/data

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Kafka
  # =========================

  kafka:
    image: apache/kafka:latest
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - backend

    restart: unless-stopped

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init

    depends_on:
      - kafka

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --list > /dev/null 2>&1
        do
          sleep 2
        done

        echo "Kafka is ready"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic users \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic server-creation-requests \
          --partitions 1 \
          --replication-factor 1

        echo "Kafka topics created"

    networks:
      - backend

    restart: "no"





  # =========================
  # Users Service
  # =========================

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile

    container_name: users-service

    environment:
      DB_HOST: users-db
      DB_PORT: 5432
      DB_USER: ${USERS_DB_USER}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      DB_NAME: ${USERS_DB_NAME}
      DB_SSLMODE: disable

    depends_on:
      - users-db

    ports:
      - "${USERS_SERVICE_PORT}:50051"

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Sessions Service
  # =========================

  sessions-service:
    build:
      context: .
      dockerfile: sessions-service/Dockerfile

    container_name: sessions-service

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - redis

    ports:
      - "${SESSIONS_SERVICE_PORT}:50052"

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Auth Service
  # =========================

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile

    container_name: auth-service

    environment:
      USER_SERVICE_HOST: users-service:50051
      SESSION_SERVICE_HOST: sessions-service:50052

    depends_on:
      - users-service
      - sessions-service

    ports:
      - "${AUTH_SERVICE_PORT}:8080"

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Server Service
  # =========================

  server-service:
    build:
      context: .
      dockerfile: server-service/Dockerfile

    container_name: server-service

    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}

    depends_on:
      - kafka

    ports:
      - "${SERVER_SERVICE_PORT}:8088"

    networks:
      - backend

    restart: unless-stopped


# =========================
# Network
# =========================

networks:
  backend:
    driver: bridge


# =========================
# Volumes
# =========================

volumes:
  users-db-data:
  # sessions-db-data:
  redis-data:
  kafka-data:
