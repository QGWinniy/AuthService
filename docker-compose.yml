services:

  ### ПИЗДА

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: postgres-etcd

    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379

    volumes:
      - etcd-data:/etcd-data

    networks:
      - postgres-ha

    restart: unless-stopped


  user-servers-patroni1:
    build:
      context: ./patroni

    image: postgres-patroni:16

    container_name: postgres-user-servers-patroni1
    hostname: user-servers-patroni1

    env_file:
    - .env

    environment:
      PATRONI_SUPERUSER_USERNAME: ${USER_SERVERS_DB_USER_PATRONI1}
      PATRONI_SUPERUSER_PASSWORD: ${USER_SERVERS_DB_PASSWORD_PATRONI1}
      PATRONI_REPLICATION_USERNAME: ${USER_SERVERS_DB_USER_PATRONI2}
      PATRONI_REPLICATION_PASSWORD: ${USER_SERVERS_DB_PASSWORD_PATRONI2}

    volumes:
      - pg1-data:/var/lib/postgresql/data
      - ./patroni/user-servers-patroni1.yml:/etc/patroni/patroni.yml:ro
      - ./migrations/user-servers:/docker-entrypoint-initdb.d:ro

    networks:
      - postgres-ha

    depends_on:
      - etcd

    restart: unless-stopped


  user-servers-patroni2:
    build:
      context: ./patroni

    image: postgres-patroni:16

    container_name: postgres-user-servers-patroni2
    hostname: user-servers-patroni2

    env_file:
    - .env

    environment:
      PATRONI_SUPERUSER_USERNAME: ${USER_SERVERS_DB_USER_PATRONI1}
      PATRONI_SUPERUSER_PASSWORD: ${USER_SERVERS_DB_PASSWORD_PATRONI1}
      PATRONI_REPLICATION_USERNAME: ${USER_SERVERS_DB_USER_PATRONI2}
      PATRONI_REPLICATION_PASSWORD: ${USER_SERVERS_DB_PASSWORD_PATRONI2}

    volumes:
      - pg2-data:/var/lib/postgresql/data
      - ./patroni/user-servers-patroni2.yml:/etc/patroni/patroni.yml:ro
      - ./migrations/user-servers:/docker-entrypoint-initdb.d:ro

    networks:
      - postgres-ha

    depends_on:
      - etcd

    restart: unless-stopped


  haproxy:
    image: haproxy:3.2-alpine

    container_name: postgres-haproxy

    ports:
      - "5432:5432"
      - "5433:5433"

    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    networks:
      - postgres-ha
      - backend

    depends_on:
      - user-servers-patroni1
      - user-servers-patroni2

    restart: unless-stopped

  # =========================
  # Users PostgreSQL
  # =========================

  users-db:
    image: postgres:16-alpine
    container_name: users-db

    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}

    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./migrations/users:/docker-entrypoint-initdb.d:ro

    networks:
      - backend

    restart: unless-stopped

  # =========================
  # User Servers PostgreSQL
  # =========================

  user-servers-db:
    image: postgres:16-alpine
    container_name: user-servers-db

    environment:
      POSTGRES_USER: ${USER_SERVERS_DB_USER_PATRONI1}
      POSTGRES_PASSWORD: ${USER_SERVERS_DB_PASSWORD_PATRONI1}
      POSTGRES_DB: ${USER_SERVERS_DB_NAME_PATRONI1}

    volumes:
      - user-servers-db-data:/var/lib/postgresql/data
      - ./migrations/user-servers:/docker-entrypoint-initdb.d:ro

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Sessions PostgreSQL
  # =========================
  #
  # Пока не используется.
  #
  # sessions-db:
  #   image: postgres:16-alpine
  #   container_name: sessions-db
  #
  #   environment:
  #     POSTGRES_USER: ${SESSIONS_DB_USER}
  #     POSTGRES_PASSWORD: ${SESSIONS_DB_PASSWORD}
  #     POSTGRES_DB: ${SESSIONS_DB_NAME}
  #
  #   volumes:
  #     - sessions-db-data:/var/lib/postgresql/data
  #     - ./migrations/sessions:/docker-entrypoint-initdb.d:ro
  #
  #   networks:
  #     - backend
  #
  #   restart: unless-stopped


  # =========================
  # Redis
  # =========================

  redis:
    image: redis:7-alpine
    container_name: redis

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis-data:/data

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Kafka
  # =========================

  kafka:
    image: apache/kafka:latest
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - backend

    restart: unless-stopped

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init

    depends_on:
      - kafka

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --list > /dev/null 2>&1
        do
          sleep 2
        done

        echo "Kafka is ready"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic users \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic server-creation-requests \
          --partitions 1 \
          --replication-factor 1

        echo "Kafka topics created"

    networks:
      - backend

    restart: "no"





  # =========================
  # Users Service
  # =========================

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile

    container_name: users-service

    environment:
      DB_HOST: users-db
      DB_PORT: 5432
      DB_USER: ${USERS_DB_USER}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      DB_NAME: ${USERS_DB_NAME}
      DB_SSLMODE: disable

    depends_on:
      - users-db

    ports:
      - "${USERS_SERVICE_PORT}:50051"

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Sessions Service
  # =========================

  sessions-service:
    build:
      context: .
      dockerfile: sessions-service/Dockerfile

    container_name: sessions-service

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - redis

    ports:
      - "${SESSIONS_SERVICE_PORT}:50052"

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Auth Service
  # =========================

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile

    container_name: auth-service

    environment:
      USER_SERVICE_HOST: users-service:50051
      SESSION_SERVICE_HOST: sessions-service:50052

    depends_on:
      - users-service
      - sessions-service

    ports:
      - "${AUTH_SERVICE_PORT}:8080"

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Server Service
  # =========================

  server-service:
    build:
      context: .
      dockerfile: server-service/Dockerfile

    container_name: server-service

    environment:
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}

      DB_HOST: haproxy
      DB_PORT: 5433
      DB_USER: ${USER_SERVERS_DB_USER_PATRONI1}
      DB_PASSWORD: ${USER_SERVERS_DB_PASSWORD_PATRONI1}
      DB_NAME: ${USER_SERVERS_DB_NAME_PATRONI1}
      DB_SSLMODE: disable

    depends_on:
      - kafka

    ports:
      - "${SERVER_SERVICE_PORT}:8088"

    networks:
      - backend

    restart: unless-stopped

  # =========================
  # Server Service Consumer
  # =========================

  server-service-consumer:
    build:
      context: .
      dockerfile: server-service-consumer/Dockerfile

    container_name: server-service-consumer

    environment:
      DB_HOST: haproxy
      DB_PORT: 5432
      DB_USER: ${USER_SERVERS_DB_USER_PATRONI1}
      DB_PASSWORD: ${USER_SERVERS_DB_PASSWORD_PATRONI1}
      DB_NAME: ${USER_SERVERS_DB_NAME_PATRONI1}
      DB_SSLMODE: disable

      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}

    depends_on:
      - kafka
      - haproxy

    ports:
      - "${SERVER_SERVICE_CONSUMER_PORT}:8089"

    networks:
      - backend

    restart: unless-stopped

  # =========================
  # SSH Connect Service
  # =========================

  ssh-connect-service:
    build:
      context: .
      dockerfile: ssh-connect-service/Dockerfile

    container_name: ssh-connect-service

    environment:
      JWT_SECRET: ${JWT_SECRET}
      SSH_CONSOLE_JWT_SECRET: ${SSH_CONSOLE_JWT_SECRET}
      SSH_CONSOLE_ENCRYPTION_KEY: ${SSH_CONSOLE_ENCRYPTION_KEY}
      SERVER_SERVICE_URL: ${SERVER_SERVICE_URL}
      SSH_CONNECT_SERVICE_PORT: 8090

    depends_on:
      - server-service

    ports:
      - "${SSH_CONNECT_SERVICE_PORT}:8090"

    networks:
      - backend

    restart: unless-stopped


# =========================
# Network
# =========================

networks:
  backend:
    driver: bridge
  postgres-ha:
    driver: bridge


# =========================
# Volumes
# =========================

volumes:
  users-db-data:
  user-servers-db-data:
  # sessions-db-data:
  redis-data:
  kafka-data:

  etcd-data:
  pg1-data:
  pg2-data:
