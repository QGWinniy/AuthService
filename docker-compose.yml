services:

  # =========================
  # Users PostgreSQL
  # =========================

  users-db:
    image: postgres:16-alpine
    container_name: users-db

    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}

    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./migrations/users:/docker-entrypoint-initdb.d:ro

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Sessions PostgreSQL
  # =========================
  #
  # Пока не используется.
  #
  # sessions-db:
  #   image: postgres:16-alpine
  #   container_name: sessions-db
  #
  #   environment:
  #     POSTGRES_USER: ${SESSIONS_DB_USER}
  #     POSTGRES_PASSWORD: ${SESSIONS_DB_PASSWORD}
  #     POSTGRES_DB: ${SESSIONS_DB_NAME}
  #
  #   volumes:
  #     - sessions-db-data:/var/lib/postgresql/data
  #     - ./migrations/sessions:/docker-entrypoint-initdb.d:ro
  #
  #   networks:
  #     - backend
  #
  #   restart: unless-stopped


  # =========================
  # Redis
  # =========================

  redis:
    image: redis:7-alpine
    container_name: redis

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis-data:/data

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Users Service
  # =========================

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile

    container_name: users-service

    environment:
      DB_HOST: users-db
      DB_PORT: 5432
      DB_USER: ${USERS_DB_USER}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      DB_NAME: ${USERS_DB_NAME}
      DB_SSLMODE: disable

    depends_on:
      - users-db

    ports:
      - "${USERS_SERVICE_PORT}:50051"

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Sessions Service
  # =========================

  sessions-service:
    build:
      context: .
      dockerfile: sessions-service/Dockerfile

    container_name: sessions-service

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - redis

    ports:
      - "${SESSIONS_SERVICE_PORT}:50052"

    networks:
      - backend

    restart: unless-stopped


  # =========================
  # Auth Service
  # =========================

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile

    container_name: auth-service

    environment:
      USER_SERVICE_HOST: users-service:50051
      SESSION_SERVICE_HOST: sessions-service:50052

    depends_on:
      - users-service
      - sessions-service

    ports:
      - "${AUTH_SERVICE_PORT}:8080"

    networks:
      - backend

    restart: unless-stopped


# =========================
# Network
# =========================

networks:
  backend:
    driver: bridge


# =========================
# Volumes
# =========================

volumes:
  users-db-data:
  # sessions-db-data:
  redis-data:

